name: Validate bank and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Safety check — no private corpus in the repo
        run: |
          if git ls-files | grep -E '^(corpus|corpus_text)/'; then
            echo "corpus files are tracked — refusing to build"; exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate question bank
        run: |
          pip install jsonschema==4.23.0
          python scripts/validate_bank.py --report

      - name: Pack bank for the site
        run: python scripts/build_site_data.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build site
        working-directory: site
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
